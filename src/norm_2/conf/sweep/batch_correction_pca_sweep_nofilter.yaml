# @package _global_

# Batch Correction Method Comparison Sweep with PCA - NO FILTERING
#
# Same as batch_correction_pca_sweep but WITHOUT:
# - Correlation pruning (prune_correlated disabled)
# - Feature filtering (filter_features disabled)
# - PC1 variance validation (max_pc1_variance set to 1.0)
#
# Use this sweep to test if filtering affects results or causes issues.
#
# USAGE:
#   uv run python src/norm_2/pipeline.py --multirun hydra/launcher=joblib \
#     hydra.launcher.n_jobs=16 +sweep=batch_correction_pca_sweep_nofilter \
#     input_override=./path/to/features.parquet

defaults:
  - /preset/dinov2_490

# Input override (set via command line)
input_override: null

# Enable batch correction validation (error if multiple methods enabled)
validate_batch_correction: true
validation_mode: "error"  # "error", "warn", or "skip"

# Skip redundant configurations where method-specific params don't apply
skip_redundant_configs: true

# Abort pipeline if any step produces NaN/Inf values in features
abort_on_invalid_features: true

# DISABLED: No PC1 variance check (set to 1.0 = 100% allowed)
max_pc1_variance: 1.0

# === DEFAULT PARAMETERS ===

# Preprocessing - NO FILTERING
corr_thresh: 1.0  # Effectively disabled (no correlation pruning)
outlier_cut: 99999  # Effectively disabled
use_sample_norm: false
sample_norm_type: l2
use_filter_features: false  # Disabled

# Base normalization (normalize_standard)
norm_method: robustmad
norm_batch_col: "Metadata_Plate"
fit_controls: false

# Batch correction method selection (mutually exclusive)
batch_method: "none"
use_tvn: false

# Spherize is INDEPENDENT - can be combined with any batch_method
use_spherize: false

# PCA dimensionality reduction (EFAAR-style, before TVN/Spherize)
use_pca: false
pca_n_components: 256
pca_whiten: false
pca_fit_controls: true

# TVN parameters
tvn_alpha: 0.3
tvn_epsilon: 1.0
tvn_batch_col: "Metadata_Plate"
tvn_fit_controls: true

# Spherize parameters
spherize_method: "ZCA-cor"
spherize_epsilon: 1e-6
spherize_batch_col: ""
spherize_fit_negcon: true

# Aggregation
agg_method: median

# === PIPELINE STEPS ===
steps:
  - name: clean_nans
    enabled: true
    params:
      na_cutoff: 0.30

  - name: sample_norm
    enabled: ${use_sample_norm}
    params:
      norm: ${sample_norm_type}

  - name: merge_metadata
    enabled: true
    params:
      metadata_dir: "analysis/feature_similarity/input"

  - name: filter_features
    enabled: false  # DISABLED
    params:
      operations:
        - name: "variance_threshold"
          freq_cut: 0.05
          unique_cut: 0.01
          var_threshold: 0.001
        - name: "drop_outliers"
          outlier_cutoff: ${outlier_cut}

  - name: prune_correlated
    enabled: false  # DISABLED
    params:
      threshold: ${corr_thresh}
      method: "pearson"

  - name: normalize_standard
    enabled: true
    params:
      method: ${norm_method}
      batch_col: ${norm_batch_col}
      fit_on_controls: ${fit_controls}
      control_key: "negcon"
      control_col: "Metadata_control_type"

  - name: normalize_pca
    enabled: ${use_pca}
    params:
      n_components: ${pca_n_components}
      whiten: ${pca_whiten}
      fit_on_controls: ${pca_fit_controls}
      control_key: "negcon"
      control_col: "Metadata_control_type"

  - name: normalize_tvn
    enabled: ${use_tvn}
    params:
      batch_col: ${tvn_batch_col}
      alpha: ${tvn_alpha}
      epsilon: ${tvn_epsilon}
      fit_on_controls: ${tvn_fit_controls}
      control_key: "negcon"
      control_col: "Metadata_control_type"

  - name: normalize_spherize
    enabled: ${use_spherize}
    params:
      method: ${spherize_method}
      batch_col: ${spherize_batch_col}
      epsilon: ${spherize_epsilon}
      fit_on_controls: ${spherize_fit_negcon}
      control_key: "negcon"
      control_col: "Metadata_control_type"

  - name: aggregate_wells
    enabled: true
    params:
      strata: ["Metadata_Plate", "Metadata_Well"]
      method: ${agg_method}

  - name: evaluate_metrics
    enabled: true
    params:
      skip_visualization: true

# === HYDRA SWEEP CONFIGURATION ===
#
# Same as batch_correction_pca_sweep but no filtering
#
hydra:
  sweeper:
    params:
      # === BATCH CORRECTION METHOD (mutually exclusive) ===
      batch_method: none,tvn

      # === SPHERIZE (independent post-processing) ===
      use_spherize: true,false
      spherize_method: ZCA-cor,ZCA
      spherize_fit_negcon: "true"

      # === BASE NORMALIZATION ===
      norm_method: none,robustmad,standardize
      fit_controls: true,false

      # === PREPROCESSING - NO FILTERING ===
      use_sample_norm: true,false
      use_filter_features: "false"  # Always disabled

      # === PCA PARAMS ===
      use_pca: true,false
      pca_n_components: "128,256"
      pca_fit_controls: "true"

      # === TVN PARAMS ===
      tvn_alpha: "0.3,0.5"
      tvn_fit_controls: true,false
      tvn_epsilon: "0.5,1.0"

      # === SPHERIZE EPSILON ===
      spherize_epsilon: "1e-6,1e-2,1.0"

      # === AGGREGATION ===
      agg_method: median,mean
