# @package _global_

# CellProfiler Sweep v10 — batch_method=tvn_efaar
#
# Target2 dataset with v9-style split-by-method configs.
# Adds outlier/corr sweeps from v6, reduced dimensions: 64,96,128,256
#
# Sweep grid: 2 norm x 2 fit_ctrl x 2 corr x 3 eps x 2 n_comp = 48 configs per dataset
# Dropped: outlier_cutoff (no effect), corr_thresh 0.8 (worst), n_comp 64 (too few)

defaults:
  - /preset/gpu_base_variance_first_v10_cp

output:
  path: "data/features/variance_first_v10/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === DEFAULT VALUES ===
batch_method: tvn_efaar
norm_method: robustmad
norm_fit_controls: true
use_wellcorr: false
use_int: true
use_sample_norm: false
use_pca: false

# Feature selection params
corr_thresh: 0.9
outlier_cutoff: 100  # fixed — 50/100/500 showed no difference

# Swept parameters (defaults — overridden by hydra.sweeper.params)
tvn_efaar_epsilon: 0.5
tvn_efaar_n_components: 128

# Canonical defaults for non-swept method params (per is_redundant_config)
tvn_original_k: 64

agg_method: median

# Fixed params (not swept)
tvn_cascade_k1: 128
tvn_cascade_k2: 32
spherize_epsilon: 0.1
spherize_fit_controls: false
spherize_remove_variance_threshold: null
spherize_remove_variance_method: threshold

# Dim/control ratio guard
dim_ratio_threshold: 2.5
dim_ratio_action: clamp

# === FIXED PARAMETERS ===
skip_visualization: true

# === HYDRA SWEEP ===
# 2 x 2 x 2 x 3 x 2 = 48 configs per dataset
hydra:
  sweeper:
    params:
      norm_method: robustmad,standardize
      norm_fit_controls: true,false
      corr_thresh: 0.9,0.95
      tvn_efaar_epsilon: 0.05,0.1,0.2
      tvn_efaar_n_components: 96,128

  launcher:
    n_jobs: 8
    prefer: processes
    verbose: 1
