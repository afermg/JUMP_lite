# @package _global_

# Focused Deep Learning Embeddings Sweep v11 lite — batch_method=tvn_efaar
#
# Jump_lite dataset with median-aggregated DL features (cl_3).
# Uses v9 preset (jump_lite metadata), v11-style reduced sweep grid.
#
# Sweep grid: 2 norm x 2 fit_ctrl x 2 prune x 3 eps x 2 n_comp = 48 configs per dataset

defaults:
  - /preset/gpu_base_variance_first_v9

output:
  path: "data/features/variance_first_v11_lite/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === DEFAULT VALUES ===
batch_method: tvn_efaar
norm_method: robustmad
norm_fit_controls: true
use_wellcorr: false
use_int: false
use_sample_norm: false
use_pca: false

# Swept parameters (defaults — overridden by hydra.sweeper.params)
tvn_efaar_epsilon: 0.5
tvn_efaar_n_components: 128

# Canonical defaults for non-swept method params (per is_redundant_config)
tvn_original_k: 64

agg_method: median

# Fixed params (not swept)
tvn_cascade_k1: 128
tvn_cascade_k2: 32
spherize_epsilon: 0.1
spherize_fit_controls: false
spherize_remove_variance_threshold: null
spherize_remove_variance_method: threshold

# Dim/control ratio guard
dim_ratio_threshold: 2.5
dim_ratio_action: clamp

# === FIXED PARAMETERS ===
skip_visualization: true
skip_batch_effects: false

# Feature selection
corr_thresh: 0.9
use_prune_correlated: true

# === HYDRA SWEEP ===
# 2 x 2 x 2 x 3 x 2 = 48 configs per dataset
hydra:
  sweeper:
    params:
      norm_method: robustmad,standardize,none
      norm_fit_controls: true,false
      use_prune_correlated: true,false
      tvn_efaar_epsilon: 0.05,0.1,0.2,0.5,1.0
      tvn_efaar_n_components: 96,128,150,170,196,256,304

  launcher:
    n_jobs: 32
    prefer: processes
    verbose: 1
