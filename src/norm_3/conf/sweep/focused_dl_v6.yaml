# @package _global_

# Focused Deep Learning Embeddings Sweep v6 (expanded)
#
# Based on v5/v6 findings — now sweeping more pipeline toggles:
#   - norm_method: robustmad vs standardize (was 54/46)
#   - norm_fit_controls: fit on controls vs all samples
#   - use_int: inverse normal transform on/off
#   - use_pca: PCA dimensionality reduction on/off
#   - batch_method: tvn_efaar vs tvn_original vs spherize_global vs none
#   - tvn_efaar_epsilon / tvn_efaar_n_components: EFAAR params
#   - tvn_original_k: TVN Original output dimensionality
#   - spherize_epsilon: Spherize regularization (global ZCA-cor, JUMP recipe)
#
# Pipeline order:
#   1. NaN removal
#   2. Low variance filtering (variance_threshold)
#   3. Normalization (RobustMAD or Standardize, ctrl or all)
#   4. Outlier removal (fixed cutoff=100)
#   5. Inverse Normal Transform (swept on/off)
#   6. Correlation pruning (fixed threshold=0.9)
#   7. PCA (swept on/off, 256 components)
#   8. Batch correction: TVN EFAAR, TVN Original, Spherize Global, or None (params swept)
#
# Sweep grid after redundancy filtering:
#   none:            2 norm × 2 fit_ctrl × 2 int × 2 pca              = 16
#   tvn_efaar:       2 norm × 2 fit_ctrl × 2 int × 2 pca × 5 eps × 2 n_comp = 160
#   tvn_original:    2 norm × 2 fit_ctrl × 2 int × 2 pca × 5 k       = 80
#   Total: 256 configs per dataset (spherize_global removed)

defaults:
  - /preset/gpu_base_variance_first

output:
  path: "data/features/variance_first_v6/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === DEFAULT VALUES (swept params need top-level keys for Hydra struct) ===
batch_method: tvn_efaar
norm_method: robustmad
norm_fit_controls: true
use_wellcorr: false
use_int: true
use_sample_norm: false
use_pca: false

# Fixed feature selection params
corr_thresh: 0.9
outlier_cutoff: 100

# Swept parameters (defaults — overridden by hydra.sweeper.params)
tvn_efaar_epsilon: 0.5
tvn_efaar_n_components: 128
tvn_original_k: 64

agg_method: median

# Fixed params (not swept)
tvn_cascade_k1: 128
tvn_cascade_k2: 32
spherize_epsilon: 0.1
spherize_fit_controls: false

# Dim/control ratio guard: clamp batch correction output dims when
# n_features / min_controls_per_batch exceeds threshold (prevents overfitting)
dim_ratio_threshold: 2.5    # ratio above which clamping kicks in
dim_ratio_action: clamp     # "clamp" = reduce to min_controls-1, "abort" = fail run

# === FIXED PARAMETERS ===
skip_visualization: true

# === HYDRA SWEEP ===
# After redundancy filtering: 256 configs per dataset (no spherize)
hydra:
  sweeper:
    params:
      norm_method: robustmad,standardize
      norm_fit_controls: true,false
      use_int: true,false
      use_pca: true,false
      batch_method: tvn_efaar,tvn_original,none
      tvn_efaar_epsilon: 0.1,0.25,0.5,1.0,2.0
      tvn_efaar_n_components: 128
      tvn_original_k: 16,32,64,128

  launcher:
    n_jobs: 32
    prefer: processes
    verbose: 1
