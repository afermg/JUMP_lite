# @package _global_

# Cell Count Baseline Sweep v11 lite — jump_lite dataset
#
# Same pattern as v11 cell count (target2) but for jump_lite:
#   - Uses v9 cell count preset (jump_lite eval params)
#   - Outputs to variance_first_v11_lite (alongside DL/CP results)
#   - Single file (no codec variants)
#
# Minimal sweep for the 2-feature cell-count baseline model.
# Only sweeps normalization method and fit-on-controls.
# All feature selection, PCA, and batch correction disabled.
#
# Sweep grid: 2 norm x 2 fit_ctrl = 4 configs

defaults:
  - /preset/gpu_base_variance_first_v9_cell_count

output:
  path: "data/features/variance_first_v11_lite/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.99

# === DEFAULT VALUES ===
batch_method: none
norm_method: robustmad
norm_fit_controls: true
use_wellcorr: false
use_int: false
use_sample_norm: false
use_pca: false
pca_n_components: 64

# Feature selection params (not swept — disabled for 2-feature model)
corr_thresh: 0.9
outlier_cutoff: 100

# Canonical defaults for non-swept method params (per is_redundant_config)
tvn_efaar_epsilon: 0.5
tvn_efaar_n_components: 128
tvn_original_k: 64

agg_method: median

# Fixed params (not swept)
tvn_cascade_k1: 128
tvn_cascade_k2: 32
spherize_epsilon: 0.1
spherize_fit_controls: false
spherize_remove_variance_threshold: null
spherize_remove_variance_method: threshold

# Dim/control ratio guard
dim_ratio_threshold: 2.5
dim_ratio_action: clamp

# === FIXED PARAMETERS ===
skip_visualization: true
skip_batch_effects: false

# === HYDRA SWEEP ===
# 2 x 2 = 4 configs
hydra:
  sweeper:
    params:
      norm_method: robustmad,standardize,none
      norm_fit_controls: true,false

  launcher:
    n_jobs: 4
    prefer: processes
    verbose: 1
