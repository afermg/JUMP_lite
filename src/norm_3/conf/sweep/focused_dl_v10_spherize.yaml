# @package _global_

# Focused Deep Learning Embeddings Sweep v10 — batch_method=spherize
#
# Target2 dataset with v9-style architecture (no INT, no outlier/corr).
# Reduced dimension range vs v9: 64,96,128,256
#
# Sweep grid: 2 norm x 2 fit_ctrl x 2 batch x 2 pca x 4 pca_dim = 64 raw configs
#   - use_pca=false configs collapse pca_dim (redundancy filter) → ~14 effective
#   spherize_epsilon fixed to 0.1: only reliably stable value on DL embeddings

defaults:
  - /preset/gpu_base_variance_first_v10_dl

output:
  path: "data/features/variance_first_v10/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === DEFAULT VALUES ===
batch_method: spherize_global
norm_method: robustmad
norm_fit_controls: true
use_wellcorr: false
use_int: false
use_sample_norm: false
use_pca: true

# Swept parameters (defaults — overridden by hydra.sweeper.params)
spherize_epsilon: 0.1
spherize_fit_controls: true
spherize_remove_variance_threshold: null
spherize_remove_variance_method: threshold
pca_n_components: 256

# Canonical defaults for non-swept method params (per is_redundant_config)
tvn_efaar_epsilon: 0.5
tvn_efaar_n_components: 128
tvn_original_k: 64

agg_method: median

# Fixed params (not swept)
tvn_cascade_k1: 128
tvn_cascade_k2: 32

# Dim/control ratio guard
dim_ratio_threshold: 2.5
dim_ratio_action: clamp

# === FIXED PARAMETERS ===
skip_visualization: true

# === HYDRA SWEEP ===
hydra:
  sweeper:
    params:
      norm_method: robustmad,standardize
      norm_fit_controls: true,false
      batch_method: spherize_global,spherize
      use_pca: true,false
      pca_n_components: 64,96,128,256
      spherize_remove_variance_threshold: null,0.40
      spherize_remove_variance_method: threshold,mp,pa

  launcher:
    n_jobs: 32
    prefer: processes
    verbose: 1
