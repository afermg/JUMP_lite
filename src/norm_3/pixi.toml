[workspace]
name = "norm_3"
version = "0.1.0"
description = "GPU-accelerated normalization for morphological profiles"
channels = ["nvidia", "rapidsai", "conda-forge"]
channel-priority = "disabled"
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
cuda-version = "12.2.*"
cuml = "24.04.*"
scikit-learn = ">=1.4,<1.6"

[pypi-dependencies]
# Core dependencies
polars = ">=0.19.0"
numpy = ">=1.24.0"
pandas = ">=2.0.0"
scipy = ">=1.11.0"
matplotlib = ">=3.0.0"
seaborn = ">=0.13.2"
pyyaml = ">=6.0"
tqdm = ">=4.0.0"

# Hydra for configuration
hydra-core = ">=1.3.0"
hydra-joblib-launcher = ">=1.2.0"
omegaconf = "*"

# Metrics
copairs = ">=0.5.1"

[activation.env]
SCIPY_ARRAY_API = "1"
PYTHONPATH = "${PIXI_PROJECT_ROOT}/.."

[tasks]
test = "python -m norm_3.tests.test_core_cpu"
pipeline = "python -m norm_3.pipeline"
