# Architecture and Normalization Method Sweep
# Tests different pipeline orders and normalization combinations
# Goal: Find optimal architecture for PA/PC performance

defaults:
  - override /hydra/launcher: joblib

# Base configuration
input:
  path: "/home/jfredinh/projects/JUMP_core/analysis/feature_similarity/output/zstd_raw_features.parquet"

output:
  path: "data/features/architecture_sweep/processed.parquet"
  compression: "zstd"

input_override: null

# Fixed optimal parameters (from previous tests)
filter_params:
  var_threshold: 0.001
  outlier_cutoff: 15
  freq_cut: 0.05
  unique_cut: 0.01

prune_threshold: 0.95

# Sweep parameters
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      # Pipeline architecture variants
      +architecture: order1,order2,order3,order4,order5
      # Normalization method variants
      +norm_method: std,mad,std_tvn03,std_tvn04,std_tvn05,mad_tvn05,std_spherize

  launcher:
    n_jobs: 4  # Parallel jobs

  run:
    dir: outputs/architecture_sweep/${now:%Y-%m-%d}/${now:%H-%M-%S}/${architecture}_${norm_method}

  sweep:
    dir: outputs/multirun/architecture_sweep/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${architecture}_${norm_method}
