# @package _global_

# Multi-parameter sweep
# Usage: python src/normalize/run_pipeline.py --multirun +sweep=correlation_sweep \
#   corr_thresh=0.7,0.8,0.9 \
#   var_thresh=0.01,0.05 \
#   outlier_cut=50,100 \
#   norm_method=standardize,robustmad

# Default values (will be overridden by command line)
corr_thresh: 0.9
var_thresh: 0.01
outlier_cut: 50
norm_method: standardize
use_tvn: false

# Override the specific step parameter using the variables
steps:
  - name: clean_nans
    enabled: true
    params:
      na_cutoff: 0.30

  - name: merge_metadata
    enabled: true
    params:
      metadata_dir: "analysis/feature_similarity/input"

  - name: filter_features
    enabled: true
    params:
      operations:
        - name: "variance_threshold"
          freq_cut: 0.05
          unique_cut: 0.01
          var_threshold: ${var_thresh}
        - name: "drop_outliers"
          outlier_cutoff: ${outlier_cut}

  - name: prune_correlated
    enabled: true
    params:
      threshold: ${corr_thresh}

  - name: normalize_standard
    enabled: true
    params:
      method: ${norm_method}
      batch_col: "Metadata_Plate"
      fit_on_controls: true
      control_key: "negcon"
      control_col: "Metadata_control_type"

  - name: normalize_tvn
    enabled: ${use_tvn}
    params:
      fit_on_controls: true 
      epsilon: 0.000001
      control_key: "negcon"
      control_col: "Metadata_control_type"

  - name: normalize_spherize
    enabled: false

  - name: aggregate_wells
    enabled: true
    params:
      strata: ["Metadata_Plate", "Metadata_Well"]
      method: "median"

  - name: evaluate_metrics
    enabled: true
    params:
      n_top_compounds: 20
