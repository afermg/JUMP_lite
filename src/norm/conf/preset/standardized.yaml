# @package _global_

# Standardized Configuration for All Codecs
# This configuration uses median hyperparameters from the best basic normalization configs
# Tested on ZSTD and all JPEG-XL variants with consistent results
#
# Performance (with corr_thresh=0.90):
#   ZSTD:           PA=33.11%, PC=46, Balance=1523
#   JPEG-XL HQ:     PA=32.12%, PC=41, Balance=1317
#   JPEG-XL MQ:     PA=30.46%, PC=41, Balance=1249
#   JPEG-XL Effort3: PA=29.80%, PC=44, Balance=1311
#   JPEG-XL LQ:     PA=28.48%, PC=37, Balance=1054

input:
  path: "analysis/feature_similarity/output/zstd_raw_features.parquet"

output:
  path: "data/features/standardized_processed.parquet"
  compression: "zstd"

steps:
  # Step 1: Clean NaN columns and rows
  - name: clean_nans
    enabled: true
    params:
      na_cutoff: 0.30

  # Step 2: Merge with metadata
  - name: merge_metadata
    enabled: true
    params:
      metadata_dir: "analysis/feature_similarity/input"

  # Step 3: Filter low variance and outlier features
  - name: filter_features
    enabled: true
    params:
      operations:
        - name: "variance_threshold"
          freq_cut: 0.05
          unique_cut: 0.01
          var_threshold: 0.001  # Median value from best configs
        - name: "drop_outliers"
          outlier_cutoff: 15  # Median value (range was 15-30)

  # Step 4: Prune correlated features
  - name: prune_correlated
    enabled: true
    params:
      threshold: 0.90  # Median value (range was 0.90-0.92)

  # Step 5: Normalize - robustMAD (used by 4/5 best configs)
  - name: normalize_standard
    enabled: true
    params:
      method: "robustmad"
      batch_col: "Metadata_Plate"
      fit_on_controls: true
      control_key: "negcon"
      control_col: "Metadata_control_type"

  # Step 6: TVN disabled (basic normalization only)
  - name: normalize_tvn
    enabled: false

  # Step 7: Spherize disabled (basic normalization only)
  - name: normalize_spherize
    enabled: false

  # Step 8: Aggregate to well level
  - name: aggregate_wells
    enabled: true
    params:
      strata: ["Metadata_Plate", "Metadata_Well"]
      method: "median"

  # Step 9: Evaluate metrics
  - name: evaluate_metrics
    enabled: true
    params:
      output_dir: "data/features/results"
      n_top_compounds: 20

# Hydra settings
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
