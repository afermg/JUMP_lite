[project]
name = "image-quality-analysis"
version = "0.1.0"
description = "GPU-accelerated image quality metrics for codec comparison"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchmetrics>=1.0.0",
    "lpips>=0.1.4",
    "zarr>=3.0.8",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "imagecodecs>=2024.1.1",
    "numcodecs>=0.12.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-image>=0.20.0",
]

[tool.uv]
package = false
