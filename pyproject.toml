[project]
name = "jump-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "<3.13, >3.11"
dependencies = [
    "aliby",
    "cellpose>=4.0.7",
    "duckdb>=1.4.2",
    "imagecodecs>=2025.8.2",
    "lpips>=0.1.4",
    "matplotlib>=3.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=9.0.0",
    "polars>=0.19.0",
    "rich>=13.0.0",
    "scikit-image>=0.20.0,<=0.24",
    "tqdm>=4.0.0",
    "zarr>=3.1.3",
    "marimo>=0.18.1",
    "trommel>=0.1.7",
    "seaborn>=0.13.2",
    "umap-learn>=0.5.9.post2",
    "hydra-core>=1.3.0",
    "hydra-joblib-launcher>=1.2.0",
    "copairs>=0.5.1",
    "plotly>=6.5.0",
    "scib-metrics>=0.5.7",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "medpy>=0.4.0",
    "hydra-optuna-sweeper>=1.2.0",
    "pycombat>=0.20",
    "inmoose>=0.9.1",
    # RAPIDS packages (cupy, rapids-singlecell, cuml, anndata) installed via pixi
    # See pixi.toml - run with: pixi run python ...
    "upsetplot>=0.9.0",
    "supervenn>=0.5.0",
    "matplotlib-venn>=1.1.2",
    "numba>=0.63.1",
    "panel>=1.8.7",
    "holoviews>=1.22.1",
    "bokeh>=3.8.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "snakemake>=8.0.0",
]

[tool.uv.sources]
aliby = { path = "../aliby", editable = true }


