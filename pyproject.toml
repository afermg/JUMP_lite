    "jupytext>=1.19.1",
    "loguru>=0.7.0",
    "lpips>=0.1.4",
    "marimo>=0.18.1",
    "matplotlib>=3.0.0",
    "medpy>=0.4.0",
    "numba>=0.63.1",
    "numcodecs>=0.16.5",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=9.0.0",
