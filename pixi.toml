[workspace]
name = "jump-core"
version = "0.1.0"
description = "JUMP Cell Painting analysis with RAPIDS support"
channels = ["rapidsai", "nvidia", "conda-forge", "bioconda"]
platforms = ["linux-64"]

[feature.rapids.dependencies]
python = "3.12.*"
rapids = "25.8.*"
cuda-version = "12.9.*"
cudnn = "*"
cutensor = "*"
cusparselt = "*"
scikit-learn = ">=1.4,<1.7"  # cuML 25.x compatible range

[feature.rapids.pypi-dependencies]
# RAPIDS packages
rapids-singlecell = "*"
anndata = "*"

# Core project dependencies
hydra-core = ">=1.3.0"
hydra-joblib-launcher = ">=1.2.0"
omegaconf = "*"
polars = ">=0.19.0"
numpy = ">=1.24.0"
pandas = ">=2.0.0"
scipy = ">=1.11.0"
# scikit-learn installed via conda for cuML compatibility
matplotlib = ">=3.0.0"
seaborn = ">=0.13.2"
tqdm = ">=4.0.0"
rich = ">=13.0.0"
pyyaml = ">=6.0"
copairs = ">=0.5.1"
inmoose = ">=0.9.1"
scib-metrics = ">=0.5.7"
broad-babel = ">=0.1.24"
plotly = ">=6.5.0"

[feature.rapids.activation.env]
SCIPY_ARRAY_API = "1"

[environments]
default = { features = ["rapids"] }
rapids = { features = ["rapids"] }
